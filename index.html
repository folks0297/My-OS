<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My OS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="desktop" id="desktop">
      <main class="main-panel">
        <div class="topbar">
          <div class="clock" id="clock">--:--:-- --</div>
          <div class="weather">🌤️ <span id="temp">17°C</span></div>
        </div>

        <form class="search" id="searchForm">
          <input
            id="searchInput"
            autocomplete="off"
            placeholder="search..."
            aria-label="Google search"
          />

          <button type="submit">go</button>
        </form>

        <div class="apps">
          <button onclick="openApp('notes')">📄 Notes</button>
          <button onclick="openApp('calc')">🧮 Calc</button>
          <button onclick="openApp('timer')">⏱️ Timer</button>
          <button onclick="openApp('todo')">☑️ Todo</button>
          <button onclick="openApp('pong')">🏓 Pong</button>
          <button onclick="openApp('about')">ℹ️ About</button>
        </div>

        <div class="hint">click an app to open it</div>
      </main>

      <div id="windows"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
